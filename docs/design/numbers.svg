<?xml-stylesheet href="theme.css" type="text/css"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="316" viewBox="0 0 1280 316">
  <!-- 핵심 숫자 카드. 세 칸 모두 현재 모델(통화 분류기 v5) 결과이고, 칸마다 무엇을 어떤 데이터로 잰 값인지 함께 적는다.
       1: 분류기 단독 사기 통화 탐지율(v2 평가 분할 사기 307통, 통화 끝 0.70 이상)
       2: 분류기 단독 정상 상담 오경보율(AI Hub 상담 Validation 5,041건, 한 번이라도 0.70 이상)
       3: 전체 시스템 사기 통화 탐지(처음 보는 test 사기 14통, 글로 입력, 최종 위험도 0.70 이상)
       출처: docs/tech/detection.md '현재 모델 성능'. 숫자가 바뀌면 README의 표와 대체 문구도 함께 고친다.
       결과: ../images/readme/numbers.png, numbers-dark.png -->
  <rect class="card" x="1" y="1" width="1278" height="314" rx="24"/>
  <g class="s-line" stroke-width="2">
    <path d="M426.5 44 V236"/>
    <path d="M853.5 44 V236"/>
    <path d="M58 262 H1222"/>
  </g>

  <!-- 1 -->
  <text class="kr f-accent-ink" x="60" y="70" font-size="24" font-weight="700">통화 분류기 v5</text>
  <text class="f-ink" x="56" y="162"><tspan class="en" font-size="92" font-weight="800" letter-spacing="-3">99.7</tspan><tspan class="en f-accent" font-size="44" font-weight="700" dx="7">%</tspan></text>
  <text class="kr f-ink2" x="60" y="204" font-size="28" font-weight="700">사기 통화 탐지율</text>
  <text class="kr f-muted" x="60" y="238" font-size="24" font-weight="400">학습에 쓰지 않은 307통</text>

  <!-- 2 -->
  <text class="kr f-accent-ink" x="478" y="70" font-size="24" font-weight="700">통화 분류기 v5</text>
  <text class="f-ink" x="474" y="162"><tspan class="en" font-size="92" font-weight="800" letter-spacing="-3">0.9</tspan><tspan class="en f-accent" font-size="44" font-weight="700" dx="7">%</tspan></text>
  <text class="kr f-ink2" x="478" y="204" font-size="28" font-weight="700">정상 상담 오경보율</text>
  <text class="kr f-muted" x="478" y="238" font-size="24" font-weight="400">AI Hub 상담 5,041건</text>

  <!-- 3 -->
  <text class="kr f-accent-ink" x="905" y="70" font-size="24" font-weight="700">전체 시스템</text>
  <text class="f-ink" x="901" y="162"><tspan class="en" font-size="92" font-weight="800" letter-spacing="-3">13</tspan><tspan class="en f-accent" font-size="44" font-weight="700" dx="10">/ 14</tspan><tspan class="kr f-accent" font-size="40" font-weight="700" dx="4">통</tspan></text>
  <text class="kr f-ink2" x="905" y="204" font-size="28" font-weight="700">사기 통화 탐지</text>
  <text class="kr f-muted" x="905" y="238" font-size="24" font-weight="400">처음 보는 통화 · 글로 입력</text>

  <text class="kr f-faint" x="640" y="296" font-size="24" font-weight="500" text-anchor="middle">경보 기준 0.70 · 세 값은 평가 데이터와 조건이 서로 다릅니다</text>
</svg>
