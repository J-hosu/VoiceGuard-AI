<?xml-stylesheet href="theme.css" type="text/css"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="820" viewBox="0 0 1280 820">
  <!-- 시스템 구조(요약). 위: 외부 서비스(서버 밖으로 보내는 내용을 상자마다 적는다) · 가운데: 자체 운영 GPU 서버 · 아래: 사용자 화면.
       발화 하나의 흐름: 음성 조각 → 전사 → 분류기(빠른 경로)와 Claude 상태 추적기 → 위험도 융합 → 대응 에이전트 → 화면·알림.
       자세한 구조도는 ../images/v2/architecture.png (원본 ../diagrams/architecture.html).
       결과: ../images/readme/architecture.png, architecture-dark.png -->
  <rect class="card" x="1" y="1" width="1278" height="818" rx="24"/>

  <!-- 외부 서비스 -->
  <rect class="f-warn-soft s-warn" x="40" y="40" width="1200" height="184" rx="18" stroke-width="2" stroke-dasharray="9 7"/>
  <text class="kr f-warn-ink" x="64" y="78" font-size="24" font-weight="700">외부 서비스</text>
  <text class="kr f-muted" x="204" y="78" font-size="24" font-weight="400">상자마다 서버 밖으로 보내는 내용을 적었습니다</text>

  <rect class="panel" x="64" y="96" width="252" height="112" rx="14"/>
  <text class="kr f-ink" x="82" y="134" font-size="26" font-weight="700">리턴제로 <tspan class="f-muted" font-size="24" font-weight="500">(선택)</tspan></text>
  <text class="kr f-muted" x="82" y="166" font-size="24" font-weight="400">재전사 · 화자 구분</text>
  <text class="kr f-warn-ink" x="82" y="196" font-size="24" font-weight="600">보냄: 음성</text>

  <rect class="panel" x="360" y="96" width="548" height="112" rx="14"/>
  <text class="kr f-ink" x="378" y="134" font-size="26" font-weight="700">Claude API</text>
  <text class="kr f-muted" x="378" y="166" font-size="24" font-weight="400">상태 추적기 · 대응 문구 · 사건 개요 · 문서 점검</text>
  <text class="kr f-warn-ink" x="378" y="196" font-size="24" font-weight="600">보냄: 전사한 통화 내용 · 문자 캡처 · 문서 사진</text>

  <rect class="panel" x="952" y="96" width="252" height="112" rx="14"/>
  <text class="kr f-ink" x="970" y="134" font-size="26" font-weight="700">n8n → Slack</text>
  <text class="kr f-muted" x="970" y="166" font-size="24" font-weight="400">보호자 알림 요청</text>
  <text class="kr f-warn-ink" x="970" y="196" font-size="24" font-weight="600">보냄: 알림 내용</text>

  <!-- 자체 운영 GPU 서버 -->
  <rect class="f-accent-soft s-accent" x="40" y="272" width="1200" height="344" rx="18" stroke-width="2"/>
  <text class="kr f-accent-ink" x="64" y="310" font-size="24" font-weight="700">자체 운영 GPU 서버</text>

  <rect class="panel" x="64" y="328" width="252" height="116" rx="14"/>
  <text class="kr f-ink" x="82" y="366" font-size="26" font-weight="700">음성 인식(전사)</text>
  <text class="kr f-muted" x="82" y="398" font-size="24" font-weight="400">Whisper large-v3</text>
  <text class="kr f-muted" x="82" y="428" font-size="24" font-weight="400">음성 조각을 글로</text>

  <rect class="panel" x="360" y="328" width="252" height="116" rx="14"/>
  <text class="kr f-ink" x="378" y="366" font-size="26" font-weight="700">통화 분류기 v5</text>
  <text class="kr f-muted" x="378" y="398" font-size="24" font-weight="400">KLUE-RoBERTa</text>
  <text class="kr f-muted" x="378" y="428" font-size="24" font-weight="400">발화마다 사기 확률</text>

  <rect class="panel" x="656" y="328" width="252" height="116" rx="14"/>
  <text class="kr f-ink" x="674" y="366" font-size="26" font-weight="700">위험도 융합</text>
  <text class="kr f-muted" x="674" y="398" font-size="24" font-weight="400">0.3 × 분류기</text>
  <text class="kr f-muted" x="674" y="428" font-size="24" font-weight="400">+ 0.7 × 추적기</text>

  <rect class="panel" x="952" y="328" width="252" height="116" rx="14"/>
  <text class="kr f-ink" x="970" y="366" font-size="26" font-weight="700">대응 에이전트</text>
  <text class="kr f-muted" x="970" y="398" font-size="24" font-weight="400">규칙으로 대응 선택</text>
  <text class="kr f-muted" x="970" y="428" font-size="24" font-weight="400">문구는 Claude 작성</text>

  <rect class="panel" x="360" y="476" width="548" height="116" rx="14"/>
  <text class="kr f-ink" x="378" y="514" font-size="26" font-weight="700">기록과 수사 지원</text>
  <text class="kr f-muted" x="378" y="546" font-size="24" font-weight="400">SQLite: 상태 · 단서 · 대응 · 무결성 해시</text>
  <text class="kr f-muted" x="378" y="576" font-size="24" font-weight="400">단서 연결 · 우선순위 점수 · 신고용 요약</text>

  <!-- 사용자 화면 -->
  <rect class="panel" x="64" y="680" width="252" height="100" rx="14"/>
  <text class="kr f-ink" x="82" y="720" font-size="26" font-weight="700">휴대폰 웹 앱</text>
  <text class="kr f-muted" x="82" y="754" font-size="24" font-weight="400">마이크 입력</text>

  <rect class="panel" x="656" y="680" width="252" height="100" rx="14"/>
  <text class="kr f-ink" x="674" y="720" font-size="26" font-weight="700">수사관 대시보드</text>
  <text class="kr f-muted" x="674" y="754" font-size="24" font-weight="400">PC 브라우저</text>

  <rect class="panel" x="952" y="680" width="252" height="100" rx="14"/>
  <text class="kr f-ink" x="970" y="720" font-size="26" font-weight="700">휴대폰 화면</text>
  <text class="kr f-muted" x="970" y="754" font-size="24" font-weight="400">경고 화면 · 진동</text>

  <!-- 흐름: 굵은 실선은 발화 하나가 지나는 주 흐름, 가는 실선은 서버 안의 기록 흐름, 주황 점선은 외부 서비스 호출 -->
  <g class="f-none s-ink" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M190 680 V448 M181 458 L190 448 L199 458"/>
    <path d="M316 386 H357 M347 377 L357 386 L347 395"/>
    <path d="M612 386 H653 M643 377 L653 386 L643 395"/>
    <path d="M908 386 H949 M939 377 L949 386 L939 395"/>
    <path d="M1078 444 V676 M1069 666 L1078 676 L1087 666"/>
  </g>
  <g class="f-none s-muted" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M782 444 V474 M774 465 L782 474 L790 465"/>
    <path d="M782 592 V678 M774 669 L782 678 L790 669"/>
  </g>
  <g class="f-none s-warn" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M338 380 V152 H352" stroke-dasharray="7 7"/>
    <path d="M349 144 L358 152 L349 160"/>
    <path d="M782 214 V320" stroke-dasharray="7 7"/>
    <path d="M774 317 L782 326 L790 317"/>
    <path d="M1078 322 V216" stroke-dasharray="7 7"/>
    <path d="M1070 219 L1078 210 L1086 219"/>
    <path d="M296 216 V320" stroke-dasharray="7 7"/>
    <path d="M288 220 L296 211 L304 220 M288 316 L296 325 L304 316"/>
  </g>
  <circle class="f-warn" cx="338" cy="386" r="6"/>

  <!-- 흐름 이름 -->
  <g class="kr f-warn-ink" font-size="24" font-weight="600">
    <text x="284" y="257" text-anchor="end">음성</text>
    <text x="350" y="257">전사문</text>
    <text x="794" y="257">단계 · 위험 판단</text>
    <text x="1090" y="257">웹훅</text>
  </g>
  <g class="kr f-muted" font-size="24" font-weight="500">
    <text x="202" y="657">음성 조각</text>
    <text x="1066" y="657" text-anchor="end">경고 · 대응 카드</text>
  </g>

  <!-- 선의 뜻 -->
  <path class="f-none s-ink" d="M348 714 H398" stroke-width="4" stroke-linecap="round"/>
  <text class="kr f-muted" x="412" y="722" font-size="24" font-weight="500">발화가 지나는 흐름</text>
  <path class="f-none s-warn" d="M348 752 H398" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="7 7"/>
  <text class="kr f-muted" x="412" y="760" font-size="24" font-weight="500">외부 서비스 호출</text>
</svg>
