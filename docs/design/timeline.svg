<?xml-stylesheet href="theme.css" type="text/css"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="672" viewBox="0 0 1280 672">
  <!-- 검찰 사칭 대본 시연(2026-11-18, 분류기 v5, 1회 실행) 한 통화의 화면 위험도. 기록: docs/one-call.md.
       화면 위험도는 다음 판단이 올 때까지 그대로이므로 계단선으로 그린다.
       시각(초) → 위험도: 3.1 → 100(분류기 단독, 전체 화면 경고) · 5.7 → 65(추적기 첫 판단) · 13.6 → 72 · 19.0 → 79 · 26.5 → 86 · 30.9 → 97 · 39.4 → 98 · 45.5 → 99
       단계: 사칭 5.7~ · 위기 조성 19.0~ · 고립 30.9~ · 금전 요구 45.5~. 발화 보낸 시각: 2 · 8 · 14 · 22 · 28 · 37 · 43초(홀수 번째가 상대방).
       좌표: x = 150 + 20.192 × 초, y = 150 + (100 - 위험도) × 4.6667 (세로축은 55%부터). 결과: ../images/readme/timeline.png, timeline-dark.png -->
  <rect class="card" x="1" y="1" width="1278" height="670" rx="24"/>

  <!-- 머리말 -->
  <text class="kr f-ink" x="58" y="68" font-size="28" font-weight="700">검찰 사칭 대본 시연 · 통화 한 건의 화면 위험도</text>
  <circle class="f-ink" cx="914" cy="59" r="7"/>
  <text class="kr f-muted" x="930" y="68" font-size="24" font-weight="500">상대방 발화</text>
  <circle class="f-card s-ink" cx="1081" cy="59" r="6" stroke-width="2.5"/>
  <text class="kr f-muted" x="1097" y="68" font-size="24" font-weight="500">사용자 발화</text>

  <!-- 경고 구간 -->
  <rect class="f-danger-soft" x="150" y="150" width="1050" height="70"/>
  <rect class="f-warn-soft" x="150" y="220" width="1050" height="70"/>
  <g class="f-none" stroke-width="2" stroke-dasharray="7 7">
    <path class="s-danger" d="M150 220 H1200"/>
    <path class="s-warn" d="M150 290 H1200"/>
  </g>
  <text class="kr f-danger-ink" x="1188" y="208" font-size="24" font-weight="600" text-anchor="end">강한 경고 85% 이상</text>
  <text class="kr f-warn-ink" x="1188" y="278" font-size="24" font-weight="600" text-anchor="end">주의 70% 이상</text>

  <!-- 세로축 -->
  <g class="en f-faint" font-size="24" font-weight="500" text-anchor="end">
    <text x="136" y="158">100%</text>
    <text x="136" y="228">85%</text>
    <text x="136" y="298">70%</text>
    <text x="136" y="368">55%</text>
  </g>

  <!-- 가로축 -->
  <path class="f-none s-wire" d="M150 360 H1200" stroke-width="2"/>
  <g class="f-none s-wire" stroke-width="2">
    <path d="M150 360 V370 M351.9 360 V370 M553.8 360 V370 M755.8 360 V370 M957.7 360 V370 M1159.6 360 V370"/>
  </g>
  <g class="kr f-faint" font-size="24" font-weight="500" text-anchor="middle">
    <text x="150" y="398">0초</text>
    <text x="351.9" y="398">10초</text>
    <text x="553.8" y="398">20초</text>
    <text x="755.8" y="398">30초</text>
    <text x="957.7" y="398">40초</text>
    <text x="1159.6" y="398">50초</text>
  </g>
  <!-- 발화 -->
  <g class="f-ink">
    <circle cx="190.2" cy="360" r="7"/>
    <circle cx="432.5" cy="360" r="7"/>
    <circle cx="715.2" cy="360" r="7"/>
    <circle cx="1018.1" cy="360" r="7"/>
  </g>
  <g class="f-card s-ink" stroke-width="2.5">
    <circle cx="311.3" cy="360" r="6"/>
    <circle cx="594" cy="360" r="6"/>
    <circle cx="896.9" cy="360" r="6"/>
  </g>

  <!-- 위험도 계단선 -->
  <path class="f-none s-ink" d="M265.5 313.33 H424.4 V280.67 H533.4 V248 H684.9 V215.33 H773.9 V164 H946.4 V159.33 H1067.7 V154.67 H1200" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
  <path class="f-none s-danger" d="M213 150 H265.5 V313.33" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
  <g class="f-ink s-card" stroke-width="3">
    <circle cx="533.4" cy="248" r="8"/>
    <circle cx="773.9" cy="164" r="8"/>
    <circle cx="946.4" cy="159.33" r="8"/>
  </g>

  <!-- 값 -->
  <g class="en" font-size="26" font-weight="700" text-anchor="middle">
    <text class="f-danger-ink" x="264" y="126">100%</text>
    <text class="f-ink" x="345" y="300">65%</text>
    <text class="f-ink" x="490" y="268">72%</text>
    <text class="f-ink" x="609" y="235">79%</text>
    <text class="f-ink" x="742" y="202">86%</text>
    <text class="f-ink" x="860" y="150">97%</text>
    <text class="f-ink" x="1000" y="145">98%</text>
    <text class="f-ink" x="1142" y="140">99%</text>
  </g>

  <!-- 번호 표시 -->
  <g class="s-card" stroke-width="3">
    <circle class="f-danger" cx="213" cy="150" r="19"/>
    <circle class="f-ink" cx="265.5" cy="313.33" r="19"/>
    <circle class="f-warn" cx="424.4" cy="280.67" r="19"/>
    <circle class="f-danger" cx="684.9" cy="215.33" r="19"/>
    <circle class="f-danger" cx="1067.7" cy="154.67" r="19"/>
  </g>
  <g class="en f-on-solid" font-size="24" font-weight="800" text-anchor="middle">
    <text x="213" y="158.5">1</text>
    <text x="265.5" y="321.8">2</text>
    <text x="424.4" y="289.2">3</text>
    <text x="684.9" y="223.8">4</text>
    <text x="1067.7" y="163.2">5</text>
  </g>

  <!-- 사기 단계 -->
  <text class="kr f-muted" x="136" y="454" font-size="24" font-weight="700" text-anchor="end">단계</text>
  <rect class="f-line" x="150" y="422" width="111.5" height="46" rx="8"/>
  <rect class="f-accent-soft" x="265.5" y="422" width="263.9" height="46" rx="8"/>
  <rect class="f-warn-soft" x="533.4" y="422" width="236.5" height="46" rx="8"/>
  <rect class="f-danger-soft" x="773.9" y="422" width="289.8" height="46" rx="8"/>
  <rect class="f-danger" x="1067.7" y="422" width="132.3" height="46" rx="8"/>
  <g class="kr" font-size="24" font-weight="700" text-anchor="middle">
    <text class="f-muted" x="205.8" y="454">판단 전</text>
    <text class="f-accent-ink" x="397.5" y="454">사칭</text>
    <text class="f-warn-ink" x="651.7" y="454">위기 조성</text>
    <text class="f-danger-ink" x="918.8" y="454">고립</text>
    <text class="f-on-solid" x="1133.9" y="454">금전 요구</text>
  </g>

  <!-- 다섯 장면 -->
  <g>
    <rect class="panel" x="58" y="504" width="220" height="128" rx="14"/>
    <rect class="panel" x="294" y="504" width="220" height="128" rx="14"/>
    <rect class="panel" x="530" y="504" width="220" height="128" rx="14"/>
    <rect class="panel" x="766" y="504" width="220" height="128" rx="14"/>
    <rect class="panel" x="1002" y="504" width="220" height="128" rx="14"/>
  </g>
  <g>
    <circle class="f-danger" cx="94" cy="542" r="19"/>
    <circle class="f-ink" cx="330" cy="542" r="19"/>
    <circle class="f-warn" cx="566" cy="542" r="19"/>
    <circle class="f-danger" cx="802" cy="542" r="19"/>
    <circle class="f-danger" cx="1038" cy="542" r="19"/>
  </g>
  <g class="en f-on-solid" font-size="24" font-weight="800" text-anchor="middle">
    <text x="94" y="550.5">1</text>
    <text x="330" y="550.5">2</text>
    <text x="566" y="550.5">3</text>
    <text x="802" y="550.5">4</text>
    <text x="1038" y="550.5">5</text>
  </g>
  <g class="kr f-muted" font-size="24" font-weight="600">
    <text x="124" y="551">3초</text>
    <text x="360" y="551">6초</text>
    <text x="596" y="551">14초</text>
    <text x="832" y="551">26초</text>
    <text x="1068" y="551">45초</text>
  </g>
  <g class="kr f-ink" font-size="26" font-weight="700">
    <text x="76" y="590">전체 화면 경고</text>
    <text x="312" y="590">65%로 재평가</text>
    <text x="548" y="590">주의 72%</text>
    <text x="784" y="590">위험 86%</text>
    <text x="1020" y="590">금전 요구 99%</text>
  </g>
  <g class="kr f-muted" font-size="24" font-weight="400">
    <text x="76" y="619">분류기 단독 판단</text>
    <text x="312" y="619">추적기 판단 도착</text>
    <text x="548" y="619">공식 번호 안내</text>
    <text x="784" y="619">전화를 끊으세요</text>
    <text x="1020" y="619">보호자 알림 요청</text>
  </g>
</svg>
