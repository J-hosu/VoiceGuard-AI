<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B1220">
<meta name="robots" content="noindex">
<title>VoiceGuard AI · 수사 지원 대시보드</title>
<style>
:root {
  --navy: #0B1220;
  --navy-2: #131C2E;
  --navy-line: #243049;
  --accent: #2563EB;
  --accent-ink: #1D4ED8;
  --accent-soft: #EFF6FF;
  --accent-line: #BFDBFE;
  --bg: #F3F5F9;
  --surface: #FFFFFF;
  --ink: #0F172A;
  --ink-2: #334155;
  --ink-3: #5B6B82;
  --line: #E2E8F0;
  --line-2: #EEF2F7;
  --high: #DC2626; --high-ink: #B91C1C; --high-soft: #FEF2F2; --high-line: #FECACA;
  --medium: #D97706; --medium-ink: #B45309; --medium-soft: #FFFBEB; --medium-line: #FDE68A;
  --low: #059669; --low-ink: #047857; --low-soft: #ECFDF5; --low-line: #A7F3D0;
  --radius: 12px;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
}
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
html, body { height: 100%; }
body {
  margin: 0;
  display: flex;
  flex-direction: column;
  height: 100vh;
  height: 100dvh;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-size: 14.5px;
  line-height: 1.6;
  word-break: keep-all;
  overflow-wrap: anywhere;
}
h1, h2, h3, p, ul, ol, dl, dd { margin: 0; padding: 0; }
ul, ol { list-style: none; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--accent-ink); }
.num { font-variant-numeric: tabular-nums; }
.sr-only {
  position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.topbar :focus-visible { outline-color: #93C5FD; }
.ic { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.print-only { display: none; }

/* ───────── 상단 바 ───────── */
.topbar {
  flex: none;
  display: flex;
  align-items: center;
  gap: 16px 28px;
  padding: 12px 24px;
  background: var(--navy);
  color: #E5ECF6;
}
.brand { display: flex; align-items: center; gap: 10px; margin-right: auto; min-width: 0; }
.brand-mark {
  width: 32px; height: 32px; flex: none; border-radius: 9px;
  display: grid; place-items: center;
  background: var(--accent); color: #fff;
}
.brand-mark .ic { width: 18px; height: 18px; }
.brand-name { font-size: 16px; font-weight: 700; letter-spacing: -0.01em; white-space: nowrap; }
.brand-name span { color: #9FB0C8; font-weight: 500; }
.stats { display: flex; gap: 8px; }
.stat {
  min-width: 108px;
  padding: 7px 14px 8px;
  border: 1px solid var(--navy-line);
  border-radius: 10px;
  background: var(--navy-2);
}
.stat dt { font-size: 12px; line-height: 1.35; color: #9FB0C8; }
.stat dd { font-size: 20px; line-height: 1.25; font-weight: 700; color: #fff; font-variant-numeric: tabular-nums; }
.app-link {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 8px 12px; border-radius: 8px;
  border: 1px solid var(--navy-line);
  color: #E5ECF6; text-decoration: none; font-size: 13.5px; white-space: nowrap;
}
.app-link:hover { background: var(--navy-2); }


/* ───────── 탭 ───────── */
.tabs { display: flex; gap: 4px; padding: 3px; border: 1px solid var(--navy-line); border-radius: 10px; background: var(--navy-2); }
.tab-btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 7px 13px; border: 0; border-radius: 8px; background: transparent;
  color: #C7D3E4; font-size: 13.5px; font-weight: 600; white-space: nowrap;
}
.tab-btn:hover { background: #1B2740; color: #fff; }
.tab-btn[aria-selected="true"] { background: var(--accent); color: #fff; }
.tab-btn .ic { width: 15px; height: 15px; }
.tab-badge { min-width: 18px; padding: 0 6px; border-radius: 999px; background: #F59E0B; color: #111827; font-size: 11.5px; line-height: 18px; text-align: center; }

/* ───────── 레이아웃 ───────── */
.layout {
  flex: 1; min-height: 0;
  display: grid;
  grid-template-columns: 392px minmax(0, 1fr);
}
.list-pane {
  display: flex; flex-direction: column; min-height: 0;
  background: var(--surface);
  border-right: 1px solid var(--line);
}
.list-head { flex: none; padding: 16px 16px 12px; border-bottom: 1px solid var(--line); }
.list-title-row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
.list-title { font-size: 15px; font-weight: 700; }
.live { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.live-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--low); }
.live.is-stale .live-dot { background: var(--medium); }
@media (prefers-reduced-motion: no-preference) {
  .live:not(.is-stale) .live-dot { animation: pulse 2.4s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .35; } }
}
.search { position: relative; margin-bottom: 10px; }
.search .ic { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--ink-3); pointer-events: none; }
.search input {
  width: 100%; height: 38px; padding: 0 12px 0 34px;
  border: 1px solid #CBD5E1; border-radius: 9px; background: #fff;
}
.search input::placeholder { color: #7A8AA0; }
.search input:focus-visible { outline-offset: 0; border-color: var(--accent); border-radius: 9px; }
.filters { display: flex; flex-wrap: wrap; gap: 6px; }
.chip-btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 5px 11px; border-radius: 999px;
  border: 1px solid #CBD5E1; background: #fff; color: var(--ink-2);
  font-size: 13px; line-height: 1.4; white-space: nowrap;
}
.chip-btn:hover { background: #F8FAFC; }
.chip-btn .cnt { color: var(--ink-3); font-variant-numeric: tabular-nums; }
.chip-btn[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
.chip-btn[aria-pressed="true"] .cnt { color: #DBEAFE; }

.list-scroll { position: relative; flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; }
.list-status { padding: 0 16px; font-size: 13.5px; color: var(--ink-2); }
.list-status:not(:empty) { padding: 12px 16px; border-bottom: 1px solid var(--line); background: #F8FAFC; }
.list-status.is-error { background: var(--high-soft); color: #7F1D1D; }
.inline-msg { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 12px; }
.inline-msg p { flex: 1 1 180px; }

.row {
  position: relative;
  display: flex; align-items: flex-start; gap: 12px;
  width: 100%; padding: 12px 16px 13px 19px;
  border: 0; border-bottom: 1px solid var(--line-2);
  background: transparent; text-align: left;
}
.row::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: transparent; }
.row:hover { background: #F8FAFC; }
.row:focus-visible { outline-offset: -2px; border-radius: 0; }
.row[aria-current="true"] { background: var(--accent-soft); }
.row[aria-current="true"]::before { background: var(--accent); }
.row-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.row-type { font-size: 14.5px; font-weight: 700; line-height: 1.4; }
.row.low .row-type { font-weight: 600; color: var(--ink-2); }
.row-meta { font-size: 12.5px; color: var(--ink-3); font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row-tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 3px; }
.row-risk { flex: none; display: flex; flex-direction: column; align-items: flex-end; gap: 2px; min-width: 52px; }
.row-pct { font-size: 17px; font-weight: 700; line-height: 1.3; font-variant-numeric: tabular-nums; }
.row-lvl { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--ink-2); }
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; background: #94A3B8; }
.high .dot, .dot.high { background: var(--high); }
.medium .dot, .dot.medium { background: var(--medium); }
.low .dot, .dot.low { background: var(--low); }
.high .row-pct { color: var(--high-ink); }
.medium .row-pct { color: var(--medium-ink); }
.low .row-pct { color: var(--low-ink); }
@media (prefers-reduced-motion: no-preference) {
  .row.is-new { animation: rowflash 3.2s ease-out; }
  @keyframes rowflash { 0%, 35% { background: #DBEAFE; } 100% { background: transparent; } }
}

.tag {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 1px 8px; border-radius: 6px;
  font-size: 12px; line-height: 1.6; white-space: nowrap;
  background: #F1F5F9; color: var(--ink-2); border: 1px solid transparent;
}
.tag .ic { width: 12px; height: 12px; }
.tag.damage { background: var(--high-soft); color: var(--high-ink); border-color: var(--high-line); font-weight: 600; }
.tag.linked { background: var(--accent-soft); color: var(--accent-ink); border-color: var(--accent-line); font-weight: 600; }
.tag.calm { background: var(--low-soft); color: var(--low-ink); border-color: var(--low-line); }
.tag.risk { background: #FFF1F2; color: #9F1239; border-color: #FECDD3; }
.tag.warm { background: var(--medium-soft); color: #92400E; border-color: var(--medium-line); }

.empty { padding: 40px 24px; text-align: center; color: var(--ink-3); }
.empty strong { display: block; margin-bottom: 4px; color: var(--ink-2); font-size: 15px; }
.empty .btn { margin-top: 14px; }

/* ───────── 상세 ───────── */
.detail { position: relative; min-width: 0; min-height: 0; overflow-y: auto; padding: 24px 28px 56px; }
.detail:focus { outline: none; }
.detail-inner { max-width: 980px; margin: 0 auto; }
.btn.back-btn { display: none; }
.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 20px 22px 22px;
  margin-bottom: 14px;
}
.card > h2, .card-title {
  display: flex; align-items: baseline; gap: 8px;
  font-size: 15.5px; font-weight: 700; letter-spacing: -0.01em;
  margin-bottom: 12px;
}
.card h2 .cnt { font-size: 13px; font-weight: 500; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.caption { font-size: 13px; color: var(--ink-3); line-height: 1.55; }
.card > .caption { margin: -6px 0 14px; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  min-height: 38px; padding: 7px 14px;
  border: 1px solid #CBD5E1; border-radius: 9px;
  background: #fff; color: var(--ink); font-size: 14px; font-weight: 600; text-decoration: none; white-space: nowrap;
}
.btn:hover { background: #F8FAFC; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { background: var(--accent-ink); }
.btn.small { min-height: 32px; padding: 4px 11px; font-size: 13px; }

.dhead-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.eyebrow { font-size: 13px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.dhead h1 { font-size: 24px; line-height: 1.3; font-weight: 700; letter-spacing: -0.02em; margin-top: 2px; }
.dhead-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.facts { display: flex; flex-wrap: wrap; gap: 14px 40px; margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--line-2); }
.fact dt { font-size: 12.5px; color: var(--ink-3); margin-bottom: 2px; }
.fact dd { font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; }
.fact .risk-line { display: flex; align-items: center; gap: 10px; }
.risk-num { font-size: 26px; line-height: 1.15; font-weight: 700; letter-spacing: -0.02em; }
.high .risk-num { color: var(--high-ink); }
.medium .risk-num { color: var(--medium-ink); }
.low .risk-num { color: var(--low-ink); }
.pill {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 2px 10px 2px 8px; border-radius: 999px; font-size: 13px; font-weight: 600; line-height: 1.6;
  border: 1px solid var(--line); background: #F8FAFC; color: var(--ink-2);
}
.pill.high { background: var(--high-soft); border-color: var(--high-line); color: var(--high-ink); }
.pill.medium { background: var(--medium-soft); border-color: var(--medium-line); color: var(--medium-ink); }
.pill.low { background: var(--low-soft); border-color: var(--low-line); color: var(--low-ink); }
.banner {
  display: flex; align-items: flex-start; gap: 10px;
  margin-top: 16px; padding: 12px 14px;
  border: 1px solid var(--high-line); border-left: 4px solid var(--high);
  border-radius: 9px; background: var(--high-soft); color: #7F1D1D;
}
.banner .ic { width: 18px; height: 18px; margin-top: 2px; color: var(--high); }
.banner strong { margin-right: 6px; }

.overview { font-size: 15px; line-height: 1.8; color: var(--ink); max-width: 76ch; white-space: pre-line; }
.card > .overview + .caption { margin: 10px 0 0; }

/* 상태(불러오는 중/오류) */
.state-box { padding: 28px 22px; }
.state-box.is-error { border-color: var(--high-line); }
.state-line { display: flex; align-items: center; gap: 10px; font-weight: 600; }
.state-box .caption { margin-top: 6px; }
.state-box .btn { margin-top: 14px; }
.spinner { width: 18px; height: 18px; flex: none; border-radius: 50%; border: 2.5px solid #CBD5E1; border-top-color: var(--accent); }
.skeleton { display: grid; gap: 10px; margin-top: 20px; }
.skeleton i { display: block; height: 12px; border-radius: 6px; background: #E8EDF4; }
.skeleton i:nth-child(2) { width: 92%; } .skeleton i:nth-child(3) { width: 78%; } .skeleton i:nth-child(4) { width: 55%; }
@media (prefers-reduced-motion: no-preference) {
  .spinner { animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .skeleton i { animation: sk 1.4s ease-in-out infinite; }
  @keyframes sk { 50% { opacity: .5; } }
}

/* 단계 경과 */
.stepper { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); margin-top: 4px; }
.step { position: relative; display: flex; flex-direction: column; align-items: center; text-align: center; padding: 0 6px; }
.step::before, .step::after { content: ""; position: absolute; top: 14px; height: 2px; background: var(--line); }
.step::before { left: 0; right: 50%; }
.step::after { left: 50%; right: 0; }
.step:first-child::before, .step:last-child::after { display: none; }
.step.lit-l::before, .step.lit-r::after { background: var(--accent); }
.step-dot {
  position: relative; z-index: 1;
  width: 30px; height: 30px; border-radius: 50%;
  display: grid; place-items: center;
  font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums;
  background: #fff; border: 2px solid #CBD5E1; color: var(--ink-3);
}
.step.reached .step-dot { background: var(--accent); border-color: var(--accent); color: #fff; }
.step.current .step-dot { box-shadow: 0 0 0 4px #DBEAFE; }
.step-body { display: flex; flex-direction: column; align-items: center; gap: 1px; margin-top: 8px; min-height: 66px; }
.step-name { font-size: 14px; font-weight: 600; line-height: 1.4; color: var(--ink-3); }
.step.reached .step-name { color: var(--ink); font-weight: 700; }
.step-time { font-size: 13px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.step-none { font-size: 12.5px; color: #7A8AA0; }
.step-flag { font-size: 12px; font-weight: 600; color: var(--accent-ink); }

.turn-link {
  display: inline-flex; align-items: center; gap: 3px;
  padding: 1px 7px; border: 1px solid var(--accent-line); border-radius: 6px;
  background: var(--accent-soft); color: var(--accent-ink);
  font-size: 12.5px; line-height: 1.6; font-variant-numeric: tabular-nums; white-space: nowrap;
}
.turn-link:hover { background: #DBEAFE; }
span.turn-link { border-color: var(--line); background: #F8FAFC; color: var(--ink-3); }

/* 단서 */
.ent-groups { display: grid; grid-template-columns: 148px minmax(0, 1fr); }
.ent-groups > dt, .ent-groups > dd { padding: 11px 0; border-top: 1px solid var(--line-2); }
.ent-groups > dt:first-of-type, .ent-groups > dt:first-of-type + dd { border-top: 0; padding-top: 2px; }
.ent-groups > dt { font-size: 13.5px; font-weight: 600; color: var(--ink-2); padding-top: 17px; }
.ent-groups > dt:first-of-type { padding-top: 8px; }
.ent-list { display: flex; flex-wrap: wrap; gap: 8px; }
.ent {
  display: inline-flex; align-items: center; flex-wrap: wrap; gap: 6px 8px; max-width: 100%;
  padding: 5px 6px 5px 12px; border: 1px solid var(--line); border-radius: 9px; background: #F8FAFC;
}
.ent-val { font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; min-width: 0; }
.copy-btn {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 2px 9px; border: 1px solid #CBD5E1; border-radius: 7px; background: #fff;
  font-size: 12.5px; line-height: 1.7; color: var(--ink-2); white-space: nowrap;
}
.copy-btn .ic { width: 13px; height: 13px; }
.copy-btn:hover { background: #F1F5F9; }
.copy-btn.is-done { border-color: var(--low-line); background: var(--low-soft); color: var(--low-ink); }
.copy-btn.is-fail { border-color: var(--high-line); background: var(--high-soft); color: var(--high-ink); }

/* 겹치는 단서 */
.link-list { display: grid; gap: 8px; }
.link-row {
  display: flex; align-items: center; gap: 14px; width: 100%;
  padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px; background: #fff; text-align: left;
}
.link-row:hover { border-color: var(--accent-line); background: var(--accent-soft); }
.link-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.link-top { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 10px; }
.link-id { font-weight: 700; color: var(--accent-ink); font-variant-numeric: tabular-nums; }
.link-type { font-weight: 600; }
.link-time { font-size: 13px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.link-shared { display: flex; flex-wrap: wrap; gap: 5px; }
.link-shared .tag { white-space: normal; font-variant-numeric: tabular-nums; }
.link-shared .tag b { font-weight: 600; color: var(--ink-3); margin-right: 2px; }
.link-risk { flex: none; display: inline-flex; align-items: center; gap: 6px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--ink-2); }
.link-row > .ic { color: var(--ink-3); }

/* 유사 공식 사례 */
.official-list { display: grid; gap: 14px; }
.official { padding-left: 14px; border-left: 3px solid var(--line); }
.official-meta { font-size: 12.5px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.official-title { font-size: 15px; font-weight: 600; line-height: 1.5; }
.official-title a { text-decoration: none; }
.official-title a:hover { text-decoration: underline; }
.official-title .ic { width: 14px; height: 14px; margin-left: 4px; vertical-align: -2px; }
.official-excerpt {
  margin-top: 4px; font-size: 13.5px; color: var(--ink-2); line-height: 1.65; max-width: 80ch;
  display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; line-clamp: 3; overflow: hidden;
}

/* 위험 발화 */
.kutt-list { display: grid; }
.kutt { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 4px 14px; padding: 12px 0; border-top: 1px solid var(--line-2); }
.kutt:first-child { border-top: 0; padding-top: 2px; }
.kutt:last-child { padding-bottom: 0; }
.kutt-side { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; }
.kutt-role { font-size: 12.5px; color: var(--ink-3); }
.kutt-text { font-size: 15px; line-height: 1.65; }
.chips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 7px; }

/* 타임라인 */
.timeline { display: grid; }
.tl-item { position: relative; display: grid; grid-template-columns: 70px 18px minmax(0, 1fr); gap: 0 10px; padding-bottom: 16px; }
.tl-item:last-child { padding-bottom: 0; }
.tl-time { font-size: 13px; color: var(--ink-3); font-variant-numeric: tabular-nums; padding-top: 1px; text-align: right; }
.tl-rail { position: relative; }
.tl-rail::before { content: ""; position: absolute; left: 50%; top: 7px; width: 10px; height: 10px; margin-left: -5px; border-radius: 50%; background: #fff; border: 2px solid var(--accent); z-index: 1; }
.tl-rail::after { content: ""; position: absolute; left: 50%; top: 12px; bottom: -22px; width: 2px; margin-left: -1px; background: var(--line); }
.tl-item:last-child .tl-rail::after { display: none; }
.tl-item.is-user .tl-rail::before { border-color: var(--ink-3); }
.tl-item.is-danger .tl-rail::before { border-color: var(--high); background: var(--high); }
.tl-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 8px; }
.tl-title { font-weight: 600; }
.tl-reason { font-size: 13.5px; color: var(--ink-2); margin-top: 2px; }
.tl-answer { margin-top: 4px; }
.tl-answer .tag { font-size: 13px; padding: 2px 10px; white-space: normal; }

/* 통화 전문 */
.collapse-btn {
  display: flex; align-items: center; gap: 8px; width: 100%;
  padding: 0; border: 0; background: none; text-align: left;
  font-size: 15.5px; font-weight: 700; letter-spacing: -0.01em;
}
.collapse-btn .cnt { font-size: 13px; font-weight: 500; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.collapse-btn .hint { margin-left: auto; display: inline-flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 600; color: var(--accent-ink); }
.collapse-btn .ic { transition: transform .15s; }
.collapse-btn[aria-expanded="true"] .ic { transform: rotate(180deg); }
.transcript > h2 { margin-bottom: 0; display: block; }
.transcript-body { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line-2); }
.chat { display: grid; gap: 10px; margin-top: 12px; }
.msg { display: flex; flex-direction: column; align-items: flex-start; max-width: 78%; scroll-margin: 90px 0; }
.msg.user { align-self: end; justify-self: end; align-items: flex-end; }
.msg-meta { display: flex; gap: 6px; align-items: center; font-size: 12px; color: var(--ink-3); margin-bottom: 3px; font-variant-numeric: tabular-nums; }
.msg-meta .flag { color: #92400E; font-weight: 600; }
.bubble { padding: 9px 13px; border-radius: 4px 14px 14px 14px; background: #F1F5F9; border: 1px solid #E2E8F0; line-height: 1.6; }
.msg.user .bubble { border-radius: 14px 4px 14px 14px; background: var(--accent-soft); border-color: var(--accent-line); }
.msg.unknown .bubble { background: #fff; border-style: dashed; border-color: #CBD5E1; }
.msg.key .bubble { background: var(--medium-soft); border-color: var(--medium-line); }
.msg:focus { outline: none; }
.msg.is-target .bubble { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ───────── 좁은 화면 ───────── */
@media (max-width: 1180px) {
  .layout { grid-template-columns: 372px minmax(0, 1fr); }
  .stat { min-width: 92px; padding: 6px 12px 7px; }
  .detail { padding: 20px 20px 48px; }
}
@media (max-width: 900px) {
  html, body { height: auto; }
  body { display: block; height: auto; min-height: 100vh; }
  .topbar { flex-wrap: wrap; padding: 12px 16px; gap: 10px 12px; }
  .brand-name { font-size: 15px; }
  .stats { order: 3; flex: 1 1 100%; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
  .stat { min-width: 0; padding: 6px 8px 7px; }
  .stat dt { font-size: 11.5px; min-height: 2.7em; display: flex; align-items: flex-end; }
  .stat dd { font-size: 18px; }
  .app-link { padding: 6px 10px; font-size: 13px; gap: 5px; }
  .layout { display: block; }
  .list-pane { border-right: 0; }
  .list-head { position: sticky; top: 0; z-index: 5; background: var(--surface); }
  .list-scroll { overflow: visible; }
  .detail { overflow: visible; padding: 14px 16px 48px; }
  body:not(.show-detail) .detail { display: none; }
  body.show-detail .list-pane, body.show-detail .stats { display: none; }
  .btn.back-btn { display: inline-flex; margin-bottom: 12px; }
  .card { padding: 16px 16px 18px; }
  .dhead h1 { font-size: 21px; }
  .dhead-actions { width: 100%; }
  .dhead-actions .btn { flex: 1; }
  .facts { gap: 12px 28px; }
  .msg { max-width: 90%; }
}
@media (max-width: 640px) {
  .link-long { display: none; }
  .stepper { display: block; }
  .step { flex-direction: row; align-items: flex-start; text-align: left; gap: 12px; padding: 0 0 14px; }
  .step:last-child { padding-bottom: 0; }
  .step::before, .step::after { left: 14px; right: auto; width: 2px; height: auto; }
  .step::before { top: 0; bottom: auto; height: 4px; }
  .step::after { top: 26px; bottom: 0; }
  .step-dot { width: 28px; height: 28px; flex: none; }
  .step-body { align-items: flex-start; flex-direction: row; flex-wrap: wrap; gap: 2px 8px; margin-top: 3px; min-height: 0; }
  .step-name { flex: 1 1 100%; }
  .ent-groups { display: block; }
  .ent-groups > dt, .ent-groups > dt:first-of-type { padding: 12px 0 0; border-top: 1px solid var(--line-2); }
  .ent-groups > dt:first-of-type { border-top: 0; padding-top: 0; }
  .ent-groups > dd, .ent-groups > dt:first-of-type + dd { padding: 6px 0 12px; border-top: 0; }
  .ent-groups > dd:last-child { padding-bottom: 0; }
  .kutt { grid-template-columns: minmax(0, 1fr); }
  .kutt-side { flex-direction: row; align-items: center; gap: 8px; }
  .link-row { gap: 10px; padding: 12px; }
  .tl-item { grid-template-columns: 62px 16px minmax(0, 1fr); gap: 0 8px; }
}

/* ───────── 인쇄: 상세만 ───────── */
@media print {
  @page { margin: 14mm 13mm; }
  html, body { height: auto !important; background: #fff !important; }
  body { display: block; font-size: 11pt; }
  .topbar, .list-pane, .back-btn, .dhead-actions, .copy-btn, .no-print, .collapse-btn .hint { display: none !important; }
  .layout { display: block; }
  .detail { display: block !important; overflow: visible; padding: 0; }
  .detail-inner { max-width: none; }
  .print-only { display: block; font-size: 9.5pt; color: #475569; margin-bottom: 8px; }
  .card { border: 0; border-top: 1px solid #CBD5E1; border-radius: 0; padding: 12px 0 14px; margin: 0; }
  .card.dhead { border-top: 0; padding-top: 0; }
  #transcriptBody[hidden] { display: block !important; }
  .official-excerpt { display: block; overflow: visible; }
  .official-title a::after { content: " (" attr(href) ")"; font-size: 8.5pt; font-weight: 400; color: #475569; word-break: break-all; }
  .official-title .ic { display: none; }
  .kutt, .tl-item, .ent, .link-row, .official, .msg, .step, .banner { break-inside: avoid; }
  .card > h2, .transcript > h2 { break-after: avoid; }
  .pill, .tag, .banner, .bubble, .step-dot, .step::before, .step::after, .turn-link, .tl-rail::before, .dot {
    -webkit-print-color-adjust: exact; print-color-adjust: exact;

}

/* ───────── 우선순위 · 증거 ───────── */

.prio { display: inline-flex; align-items: center; gap: 4px; margin-top: 3px; padding: 1px 8px; border-radius: 999px; font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums; background: #EEF2FF; color: #3730A3; border: 1px solid #C7D2FE; }

.ok { color: var(--low-ink); font-weight: 700; }

/* ───────── 탭 화면 공통 ───────── */
.view { flex: 1; min-height: 0; overflow-y: auto; padding: 24px 28px 56px; }
.view-inner { max-width: 1180px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }

.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; }
.kpi { padding: 12px 14px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
.kpi dt { font-size: 12.5px; color: var(--ink-3); }

.kpi dd small { font-size: 13px; font-weight: 500; color: var(--ink-3); margin-left: 4px; }
.seg { display: inline-flex; gap: 4px; flex-wrap: wrap; }
.note { font-size: 13px; color: var(--ink-3); }
.mtable { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.mtable th, .mtable td { padding: 8px 10px; border-bottom: 1px solid var(--line-2); text-align: left; vertical-align: top; }
.mtable th { color: var(--ink-3); font-weight: 600; font-size: 12.5px; background: #F8FAFC; }
.mtable td.num, .mtable th.num { text-align: right; }
.after { color: var(--accent-ink); font-weight: 700; }

/* ───────── 관계 그래프 ───────── */
.graph-wrap { position: relative; border: 1px solid var(--line); border-radius: var(--radius); background: #FBFCFE; overflow: hidden; }
.graph-svg { display: block; width: 100%; height: 640px; }
.graph-svg .edge { stroke: #CBD5E1; stroke-width: 1.2; }
.graph-svg .edge.shared { stroke: #F59E0B; stroke-width: 2.2; }
.graph-svg .case-node { cursor: pointer; }
.graph-svg .case-node circle { stroke: #fff; stroke-width: 2.5; }
.graph-svg .case-node:hover circle, .graph-svg .case-node:focus circle { stroke: var(--ink); }
.graph-svg text { font-family: var(--font); pointer-events: none; }
.graph-legend { display: flex; flex-wrap: wrap; gap: 8px 16px; font-size: 12.5px; color: var(--ink-2); }
.lg { display: inline-flex; align-items: center; gap: 6px; }
.lg i { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
.lg i.sq { border-radius: 3px; }

/* ───────── 신종 수법 ───────── */
.kcard { border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; }
.kcard.pending { border-color: #FCD34D; box-shadow: 0 0 0 3px #FEF3C7 inset; }
.kcard-head { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; flex-wrap: wrap; }

.kcard .src { font-size: 12.5px; color: var(--ink-3); }
.kgrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.kgrid h4 { font-size: 12.5px; color: var(--ink-3); margin: 0 0 4px; font-weight: 600; }
.kgrid li { font-size: 13.5px; line-height: 1.55; padding-left: 12px; position: relative; }
.kgrid li::before { content: ''; position: absolute; left: 2px; top: 9px; width: 4px; height: 4px; border-radius: 50%; background: var(--ink-3); }
.kstatus { font-size: 12.5px; font-weight: 700; padding: 3px 10px; border-radius: 999px; }
.kstatus.pending { background: #FEF3C7; color: #92400E; }
.kstatus.approved { background: var(--low-soft); color: var(--low-ink); }
.kstatus.rejected { background: #F1F5F9; color: var(--ink-3); }
@media (max-width: 900px) {
  .tabs { order: 3; width: 100%; overflow-x: auto; }
  .view { padding: 14px 16px 48px; }
  .kgrid { grid-template-columns: minmax(0, 1fr); }
  .graph-svg { height: 480px; }
}
@media print { .tabs, .sorts { display: none !important; } }

/* ───────── 절차 안내 · 법령 ───────── */
.guide-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 0 0 6px; }
.guide-headline { font-weight: 700; font-size: 15px; color: var(--ink); }

.guide-item.caution { border-color: var(--medium-line); background: var(--medium-soft); }

.guide-top { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.guide-title { font-weight: 700; font-size: 13.5px; color: var(--ink); }
.guide-text { margin: 6px 0 0; font-size: 13.5px; line-height: 1.65; color: var(--ink-2); }
.guide-basis { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.law-ref {
  display: inline-flex; align-items: center; gap: 4px; padding: 1px 9px; border: 1px solid var(--line); border-radius: 999px;
  font-size: 12px; line-height: 1.7; color: var(--accent-ink); background: var(--surface); text-decoration: none;
}
.law-ref:hover { border-color: var(--accent-line); background: var(--accent-soft); }
.law-ref .ic { width: 11px; height: 11px; }
.due { font-size: 12px; font-weight: 700; padding: 1px 9px; border-radius: 999px; line-height: 1.7; background: #EEF2F7; color: var(--ink-2); }
.due.soon { background: var(--high-soft); color: var(--high-ink); }
.guide-more { margin-top: 14px; }
.guide-more > summary { cursor: pointer; font-size: 13px; font-weight: 600; color: var(--ink-2); }
.facts-form {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px 16px;
  margin-top: 10px; padding: 12px; border: 1px solid var(--line); border-radius: 10px; background: #F8FAFC;
}
.facts-form fieldset { border: 0; margin: 0; padding: 0; min-width: 0; grid-column: 1 / -1; }
.facts-form .opts { display: flex; flex-wrap: wrap; gap: 2px 20px; }
.facts-form legend, .facts-form .fl { display: block; font-size: 12px; font-weight: 700; color: var(--ink-3); margin-bottom: 4px; padding: 0; }
.facts-form .opt { display: flex; align-items: flex-start; gap: 6px; font-size: 13px; line-height: 1.45; color: var(--ink-2); margin: 3px 0; }
.facts-form .opt input { margin-top: 3px; flex: none; }
.facts-form input[type="number"], .facts-form input[type="date"], .facts-form select {
  width: 100%; box-sizing: border-box; min-height: 34px; padding: 5px 8px; border: 1px solid #CBD5E1; border-radius: 8px;
  font: inherit; font-size: 13px; background: var(--surface); color: var(--ink);
}
.facts-form .hint { font-size: 12px; color: var(--ink-3); margin-top: 4px; line-height: 1.5; }

.guide-foot { margin-top: 14px; font-size: 12.5px; color: var(--ink-3); line-height: 1.6; }
.legal-search { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0 8px; }

.legal-search select { min-height: 40px; padding: 8px 10px; border: 1px solid #CBD5E1; border-radius: 10px; font: inherit; background: var(--surface); max-width: 100%; }

.table-scroll { overflow-x: auto; }
</style>

<a class="sr-only" href="#detail">사건 상세로 건너뛰기</a>

<header class="topbar">
  <div class="brand">

<script>
(function () {
  'use strict';

  var ROLE = { suspect: '상대방', user: '사용자', unknown: '미상' };
  var LEVEL = { low: '낮음', medium: '주의', high: '높음' };
  var ENTITY = {

    person: '이름·직함', amount: '요구 금액', app: '설치 요구 앱', case_number: '사건번호'

            h('td', { text: String(r.trigger || '').indexOf('knowledge:') === 0 ? '수법 카드 승인' : r.trigger === 'dashboard' ? '대시보드' : String(r.trigger || '') }),
            h('td', { class: 'num ' + (done ? (r.passed ? 'ok' : 'bad') : ''), text: done ? r.passed_count + '/' + r.total : r.status === 'running' ? '진행 중' : '실패' }),
            h('td', { class: 'num', text: done && r.recall != null ? Math.round(r.recall * 100) + '%' : '–' }),
            h('td', { class: 'num', text: done && r.false_alarm_rate != null ? Math.round(r.false_alarm_rate * 100) + '%' : '–' }),
            h('td', { class: 'num', text: done && r.avg_first_warning_turn != null ? r.avg_first_warning_turn + '번째 발화' : '–' }));
        }))) : h('p', { class: 'note', text: '아직 실행한 평가가 없습니다.' })));
    if (running) setTimeout(function () { if (state.tab === 'quality') loadQuality(); }, 6000);
  }

  /* ───────── 이벤트 ───────── */
  $('caseList').addEventListener('click', function (e) {
    var btn = e.target.closest ? e.target.closest('.row') : null;
    if (btn) select(btn.getAttribute('data-id'), { reveal: true });
  });
  $('caseList').addEventListener('keydown', function (e) {
    if (e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
    var li = e.target.closest ? e.target.closest('li') : null;
    if (!li) return;
    var next = e.key === 'ArrowDown' ? li.nextElementSibling : li.previousElementSibling;
    if (next && next.firstChild) { e.preventDefault(); next.firstChild.focus(); }
  });
  $('filters').addEventListener('click', function (e) {
    var btn = e.target.closest ? e.target.closest('[data-filter]') : null;
    if (!btn) return;
    state.filter = btn.getAttribute('data-filter');
    renderList(false);
    $('listScroll').scrollTop = 0;
  });
  $('q').addEventListener('input', function (e) { state.query = e.target.value; renderList(false); });
  function renderSorts() {
    var box = clear($('sorts'));
    box.appendChild(h('span', { class: 'sorts-label', text: '정렬' }));
    [['recent', '최신순'], ['priority', '우선순위순']].forEach(function (o) {
      box.appendChild(h('button', { type: 'button', class: 'chip-btn', 'data-sort': o[0], 'aria-pressed': String(state.sort === o[0]) }, o[1]));
    });
  }
  $('sorts').addEventListener('click', function (e) {
    var btn = e.target.closest ? e.target.closest('[data-sort]') : null;
    if (!btn) return;
    state.sort = btn.getAttribute('data-sort');
    state.cases = sortCases(state.cases);
    renderSorts();
    renderList(false);
    $('listScroll').scrollTop = 0;
  });
  $('tabs').addEventListener('click', function (e) {
    var btn = e.target.closest ? e.target.closest('[data-tab]') : null;
    if (btn) showTab(btn.getAttribute('data-tab'), true);
  });
  $('backBtn').addEventListener('click', function () {
    setReveal(false);
    var rec = state.rows[state.selectedId];
    if (rec) rec.btn.focus({ preventScroll: true });
  });
  window.addEventListener('hashchange', function () {
    var tab = tabFromHash();
    if (tab) { if (tab !== state.tab) showTab(tab, false); return; }
    if (state.tab !== 'cases') showTab('cases', false);
    var id = hashId();
    if (id != null && id !== state.selectedId) select(id, { hash: false, reveal: true });
  });
  document.addEventListener('visibilitychange', function () { if (!document.hidden && state.listLoaded) loadList(false); });
  setInterval(function () { if (!document.hidden) loadList(false); }, REFRESH_MS);

  /* ───────── 시작 ───────── */
  $('brandMark').appendChild(icon('shield'));
  $('searchIcon').appendChild(icon('search'));
  $('appLink').insertBefore(icon('back'), $('appLink').firstChild);
  $('backBtn').insertBefore(icon('back'), $('backBtn').firstChild);
  state.known = {};
  renderFilters();
  renderSorts();
  loadList(false);
  refreshKnowledgeBadge();
  if (tabFromHash()) showTab(tabFromHash(), false);
})();
</script>
</body>
</html>
